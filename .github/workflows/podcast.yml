name: Podcast audio

# Runs after the weekly Claude update pushes a new podcast/script.txt.
# Creates the MP3 with HeyGen, rebuilds docs/ and commits the result.
on:
  push:
    branches: [main]
    paths: [podcast/script.txt]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: podcast-audio
  cancel-in-progress: false

jobs:
  audio:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Check secret
        env:
          HEYGEN_API_KEY: ${{ secrets.HEYGEN_API_KEY }}
        run: |
          if [ -z "$HEYGEN_API_KEY" ]; then
            echo "::error::Secret HEYGEN_API_KEY fehlt (Settings > Secrets and variables > Actions)."
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ffmpeg and requests
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q requests

      - name: Generate audio
        env:
          HEYGEN_API_KEY: ${{ secrets.HEYGEN_API_KEY }}
        run: python3 automation/tts_heygen.py

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Build site
        run: |
          pnpm install --frozen-lockfile
          bash automation/publish.sh

      - name: Commit
        run: |
          git config user.name "rogerbasler"
          git config user.email "22345508+rogerbasler@users.noreply.github.com"
          git add client/public/podcast docs client/src/data/sampleData.ts automation/voice.json
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "Podcast audio - $(date -u +%F)"
          git pull --rebase origin main
          git push origin main
